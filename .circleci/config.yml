          command: git clone --depth 1 --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress sources
          command: tar --extract --bzip2 --file=stage-sources-release.tar.bz2
      - run:
          name: Record build info
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Package artifacts
          command: /bin/sleep 30
